name: "Nemlig tilbudshenter"
version: "0.4.1"
slug: "nemlig_tilbud"
description: "Prissætter dine Mealie-retter med Nemligs aktuelle priser (inkl. prismatch med REMA 1000) og samler tilbud, gratis, madspild og store rabatter."
url: "https://github.com/magnusbramsted/nemlig-tilbud-addon"
arch:
  - aarch64
startup: services
boot: auto
init: false
map:
  - share:rw
options:
  update_interval_hours: 24
  mealie_api_token: ""
  high_discount_threshold_percent: 50
schema:
  update_interval_hours: int(1,168)
  mealie_api_token: password
  high_discount_threshold_percent: int(0,100)
  mealie_url: url?
