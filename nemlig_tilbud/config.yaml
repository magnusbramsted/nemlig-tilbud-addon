name: "Nemlig tilbudshenter"
version: "0.7.0"
slug: "nemlig_tilbud"
description: "Prissætter dine Mealie-retter med Nemligs aktuelle priser (inkl. prismatch med REMA 1000), samler tilbud, gratis, madspild og store rabatter, lægger indkøbslisten i Nemlig-kurven og viser gratis leveringstider."
url: "https://github.com/magnusbramsted/nemlig-tilbud-addon"
arch:
  - aarch64
startup: services
boot: auto
init: false
homeassistant_api: true
map:
  - share:rw
options:
  update_interval_hours: 24
  mealie_api_token: ""
  high_discount_threshold_percent: 50
  nemlig_email: ""
  nemlig_password: ""
  preferred_delivery: "tir 15-18"
schema:
  update_interval_hours: int(1,168)
  mealie_api_token: password
  high_discount_threshold_percent: int(0,100)
  mealie_url: url?
  nemlig_email: str?
  nemlig_password: password?
  preferred_delivery: str?
